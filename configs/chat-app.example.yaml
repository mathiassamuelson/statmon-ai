# Production chat application configuration
# Copy to /etc/statmon-chat/config.yaml on the chat VM

server:
  host: "0.0.0.0"
  port: 8443

anthropic:
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096

# Optional: path to a custom prompt template file (system prompt).
# Defaults to the bundled statmon_chat/prompt.txt.
# prompt_path: "/path/to/statmon-ai-proprietary/statmon-chat/statmon_chat/prompt.txt"

nodes:
  - name: "dns-node-a"
    mcp_url: "http://10.0.1.10:8100/mcp"
  - name: "dns-node-b"
    mcp_url: "http://10.0.1.11:8100/mcp"

# Optional: security investigation tools configuration
# All settings have sensible defaults — this section can be omitted entirely.
# security_tools:
#   dns_resolver: "system"          # "system", "8.8.8.8", "1.1.1.1"
#   whois_timeout_seconds: 10
#   geolocation_provider: "ip-api"  # "ip-api" (free, no key needed)
#   # Future: API keys for threat intel services
#   # virustotal_api_key: ""
#   # abuseipdb_api_key: ""
