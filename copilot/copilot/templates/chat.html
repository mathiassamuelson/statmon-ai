<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Operator Copilot</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <h1>DNS Operator Copilot</h1>
        <span id="node-status" class="node-badge">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">{{ connected }}/{{ configured }} node(s)</span>
        </span>
    </header>

    <div id="input-bar">
        <form id="chat-form" autocomplete="off">
            <input type="text" id="message-input" placeholder="Ask about DNS traffic, security, performance..." autofocus>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <main id="chat-area">
        <div id="messages"></div>
    </main>

    <script>
        let sessionId = null;
        const messagesEl = document.getElementById('messages');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        function fmtMs(ms) {
            if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
            return Math.round(ms) + 'ms';
        }

        function fmtBytes(bytes) {
            if (bytes >= 1024) return (bytes / 1024).toFixed(1) + 'KB';
            return bytes + 'B';
        }

        function buildTraceHtml(trace) {
            if (!trace || !trace.rounds || trace.rounds.length === 0) return '';

            const summary = `${fmtMs(trace.total_ms)} | ${trace.round_count} round(s) | ${trace.tool_call_count} tool call(s)`;
            let lines = [];

            trace.rounds.forEach((round, ri) => {
                const isLast = ri === trace.rounds.length - 1;
                const prefix = isLast ? '\u2514\u2500' : '\u251c\u2500';
                const childPrefix = isLast ? '   ' : '\u2502  ';

                let roundLine = `${prefix} Round ${round.round_num + 1}: `;
                if (round.api_call) {
                    const m = round.api_call.metadata || {};
                    roundLine += `API ${fmtMs(round.api_call.duration_ms)}`;
                    if (m.input_tokens || m.output_tokens) {
                        roundLine += ` (in:${(m.input_tokens || 0).toLocaleString()} out:${(m.output_tokens || 0).toLocaleString()} tokens)`;
                    }
                }
                if (round.tool_batch) {
                    const tc = (round.tool_calls || []).length;
                    roundLine += ` \u2192 ${tc} tool(s) (parallel, ${fmtMs(round.tool_batch.duration_ms)})`;
                }
                lines.push(roundLine);

                if (round.tool_calls) {
                    round.tool_calls.forEach((tc, ti) => {
                        const tcLast = ti === round.tool_calls.length - 1;
                        const tcPrefix = tcLast ? '\u2514\u2500' : '\u251c\u2500';
                        const m = tc.metadata || {};
                        let tcLine = `${childPrefix}${tcPrefix} ${m.tool_name || tc.name}`;
                        if (m.command) tcLine += `: ${m.command}`;
                        tcLine += ` \u2014 ${fmtMs(tc.duration_ms)}`;
                        const details = [];
                        if (m.cli_execution_ms !== undefined) details.push(`CLI: ${fmtMs(m.cli_execution_ms)}`);
                        if (m.response_bytes !== undefined) details.push(fmtBytes(m.response_bytes));
                        if (details.length) tcLine += ` (${details.join(', ')})`;
                        lines.push(tcLine);
                    });
                }
            });

            return `<details class="trace"><summary>${summary}</summary><pre>${lines.join('\n')}</pre></details>`;
        }

        function appendMessage(role, text, trace) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (role === 'assistant') {
                div.innerHTML = marked.parse(text) + buildTraceHtml(trace);
            } else {
                div.textContent = text;
            }
            messagesEl.prepend(div);
        }

        function createLoadingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message assistant loading';
            indicator.id = 'loading-indicator';
            messagesEl.prepend(indicator);
        }

        function addLoadingStep(message) {
            const indicator = document.getElementById('loading-indicator');
            if (!indicator) return;
            const step = document.createElement('div');
            step.className = 'loading-step';
            step.textContent = message;
            indicator.appendChild(step);
        }

        function removeLoadingIndicator() {
            const indicator = document.getElementById('loading-indicator');
            if (indicator) indicator.remove();
        }

        function setInputEnabled(enabled) {
            sendBtn.disabled = !enabled;
            input.disabled = !enabled;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';
            setInputEnabled(false);
            createLoadingIndicator();

            try {
                const body = { message };
                if (sessionId) body.session_id = sessionId;

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (!res.ok) {
                    // Non-streaming error (e.g. 400 empty message)
                    let errMsg = `Error: HTTP ${res.status}`;
                    try {
                        const data = await res.json();
                        errMsg = `Error: ${data.error || errMsg}`;
                    } catch {}
                    removeLoadingIndicator();
                    appendMessage('assistant', errMsg);
                    return;
                }

                // Read SSE stream
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const raw = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        if (!raw.startsWith('data: ')) continue;

                        const event = JSON.parse(raw.slice(6));
                        if (event.type === 'status') {
                            addLoadingStep(event.message);
                        } else if (event.type === 'result') {
                            removeLoadingIndicator();
                            sessionId = event.session_id;
                            appendMessage('assistant', event.response, event.trace);
                        } else if (event.type === 'error') {
                            removeLoadingIndicator();
                            appendMessage('assistant', `Error: ${event.error}`);
                        }
                    }
                }
            } catch (err) {
                removeLoadingIndicator();
                appendMessage('assistant', `Connection error: ${err.message}`);
            } finally {
                setInputEnabled(true);
                input.focus();
            }
        });

        // Node health status polling
        function updateNodeStatus(data) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const { connected, configured } = data;

            text.textContent = `${connected}/${configured} node(s)`;

            if (configured === 0) {
                dot.className = 'status-dot';
            } else if (connected === configured) {
                dot.className = 'status-dot healthy';
            } else if (connected > 0) {
                dot.className = 'status-dot degraded';
            } else {
                dot.className = 'status-dot down';
            }
        }

        function pollNodeStatus() {
            fetch('/api/nodes')
                .then(r => r.json())
                .then(updateNodeStatus)
                .catch(() => {
                    const dot = document.getElementById('status-dot');
                    dot.className = 'status-dot down';
                });
        }

        // Initial status check, then poll every 30 seconds
        pollNodeStatus();
        setInterval(pollNodeStatus, 30000);
    </script>
</body>
</html>
