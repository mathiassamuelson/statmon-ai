[project]
name = "copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "mcp[client]",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "jinja2",
    "python-whois",
    "dnspython",
    "httpx",
]

[project.scripts]
copilot-cli = "copilot.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copilot*"]
