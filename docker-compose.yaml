services:
  mcp-node-a:
    build: ./statmon-mcp
    container_name: mcp-node-a
    environment:
      - NODE_NAME=dns-node-a
    volumes:
      - /etc/statmon-mcp/config.yaml:/etc/statmon-mcp/config.yaml:ro
    ports:
      - "8101:8100"
    networks:
      - statmon-net

  mcp-node-b:
    build: ./statmon-mcp
    container_name: mcp-node-b
    environment:
      - NODE_NAME=dns-node-b
    volumes:
      - /etc/statmon-mcp/config.yaml:/etc/statmon-mcp/config.yaml:ro
    ports:
      - "8102:8100"
    networks:
      - statmon-net

  chat:
    build: ./statmon-chat
    container_name: statmon-chat
    env_file:
      - .env
    volumes:
      - /etc/statmon-chat/config.yaml:/etc/statmon-chat/config.yaml:ro
    ports:
      - "8443:8443"
    depends_on:
      - mcp-node-a
      - mcp-node-b
    networks:
      - statmon-net

networks:
  statmon-net:
    driver: bridge
